[workspace]
resolver = "3"
members = [
    "todo-logic",
    "todo-axum",
    "todo-rocket",
    "todo-actix-web",
    "todo-warp",
    "hero-manager-axum",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
todo-logic = { path = "todo-logic" }

actix-web = "4.19"
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "cargo", "env"] }
http-api-problem = { version = "0.60", features = ["axum"] }
hyper-util = "0.1"
mockall = "0.15"
rocket = { version = "0.5.2", features = ["json"] }
rstest = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "chrono"] }
thiserror = "2"
tokio = "1.54"
tower = "0.5"
tower-http = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
validator = { version = "0.21", features = ["derive"] }
warp = { version = "0.4", features = ["server"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
